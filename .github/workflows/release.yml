name: Build and publish Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            python scripts/generate_release_notes.py "$GITHUB_REF_NAME" "$previous_tag"
          else
            python scripts/generate_release_notes.py "$GITHUB_REF_NAME"
          fi

      - name: Build release EXE
        shell: bash
        run: python scripts/build_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightFlipper-Windows
          path: dist/LightFlipper.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LightFlipper.exe
          body_path: release-notes.md
