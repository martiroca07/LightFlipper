[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightflipper"
version = "0.1.1"
description = "LightFlipper desktop companion for Flipper Zero"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7.0",
  "bleak>=0.22.0",
  "pyserial>=3.5",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
